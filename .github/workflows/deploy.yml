name: Test & Deploy

# Test ก่อน deploy เสมอ (ตามกฎใน CLAUDE.md):
#  - ทุก push / PR  -> รัน test (lint + build)
#  - push เข้า main -> deploy Production บน Vercel  (หลัง test ผ่านเท่านั้น)
#  - push branch อื่น -> deploy Preview            (หลัง test ผ่านเท่านั้น)

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (lint)
        run: npm run lint
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: test            # <-- deploy ต่อเมื่อ test ผ่านเท่านั้น
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # ----- Production (push เข้า main) -----
      - name: Deploy Production
        if: github.ref == 'refs/heads/main'
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # ----- Preview (branch อื่น ๆ) -----
      - name: Deploy Preview
        if: github.ref != 'refs/heads/main'
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
