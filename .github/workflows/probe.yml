# Temporary diagnostic — curls a map short link and the deployed
# resolve-map endpoint from a GitHub runner (the dev sandbox has no egress).
# Safe to delete once link auto-fill is confirmed working.
name: probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: amap short link redirect chain
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 16_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.5 Mobile/15E148 Safari/604.1"
          echo "== redirect chain (mobile UA) =="
          curl -s -A "$UA" -H "Accept-Language: zh-CN,zh;q=0.9" -o /dev/null -w "%{http_code} -> %{redirect_url}\n" "https://surl.amap.com/iGtckjwkbgO"
          echo "== final URL (mobile UA, follow) =="
          curl -sL -A "$UA" -H "Accept-Language: zh-CN,zh;q=0.9" -o /tmp/body.html -w "%{url_effective}\n" "https://surl.amap.com/iGtckjwkbgO"
          echo "== title / og:title =="
          grep -oE '<title>[^<]*</title>' /tmp/body.html | head -3 || true
          grep -oE 'og:title[^>]{0,200}' /tmp/body.html | head -3 || true
          echo "== name-ish json keys =="
          grep -oE '"(name|poiname|poiName|title)"\s*:\s*"[^"]{1,80}"' /tmp/body.html | head -10 || true
          echo "== body size =="; wc -c < /tmp/body.html
          echo "== body head =="; head -c 1500 /tmp/body.html; echo
      - name: deployed api
        run: |
          echo "== /api/resolve-map debug (amap) =="
          curl -s --max-time 25 "https://trip-kohl-three.vercel.app/api/resolve-map?url=https%3A%2F%2Fsurl.amap.com%2FiGtckjwkbgO&debug=1" | head -c 3000; echo
